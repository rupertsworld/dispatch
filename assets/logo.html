<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dispatch logo</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: clamp(20px, 5vw, 60px); background: #e9e8e4; color: #202420; font: 14px/1.5 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { max-width: 920px; margin: auto; }
    h1 { margin: 0 0 4px; font-size: 23px; letter-spacing: -.04em; }
    p { margin: 0 0 24px; color: #717770; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .tile { min-height: 250px; display: grid; place-items: center; border: 1px solid #d2d4ce; border-radius: 10px; background: #fff; }
    .tile.dark { background: #0e100f; border-color: #0e100f; }
    .lockup { display: flex; align-items: center; gap: 20px; font-size: 42px; font-weight: 650; letter-spacing: -.065em; }
    .dark .lockup { color: #f7f7f5; }
    .lockup img { width: 70px; height: 70px; }
    .downloads { display: flex; gap: 12px; margin-top: 16px; flex-wrap: wrap; }
    a { color: #254d2c; text-underline-offset: 3px; }
    @media(max-width: 600px) { .grid { grid-template-columns: 1fr; } .tile { min-height: 190px; } .lockup { font-size: 34px; } .lockup img { width: 55px; height: 55px; } }
  </style>
</head>
<body>
  <main>
    <h1>Dispatch logo</h1>
    <p>Scalable, transparent marks for light and dark backgrounds.</p>
    <div class="grid">
      <div class="tile"><div class="lockup"><img src="dispatch-mark.svg" alt="Dispatch mark">dispatch</div></div>
      <div class="tile dark"><div class="lockup"><img src="dispatch-mark-light.svg" alt="Dispatch mark">dispatch</div></div>
    </div>
    <div class="downloads"><a href="dispatch-mark.svg" download>Download dark SVG</a><a href="dispatch-mark-light.svg" download>Download light SVG</a></div>
  </main>
</body>
</html>
